# Build the store and publish dist/ to Cloudflare Workers static assets (wrangler.jsonc) on every
# push to main, or by hand (Actions → Deploy to Cloudflare → Run workflow). Setup: docs/DEPLOY.md.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a queued run waits instead of cancelling a deployment in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

# Actions are pinned to release commit SHAs (tag in the comment); Dependabot (github-actions)
# opens PRs that update both.
jobs:
  deploy:
    # Skipped (not failed) until the repository variables exist (docs/DEPLOY.md).
    if: vars.VITE_SUPABASE_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # Repository variables (Settings → Secrets and variables → Actions → Variables).
      # Only the public anon/publishable key belongs here; it ends up in the browser bundle anyway.
      # The build fails on a secret or service_role key (src/config/publicKey.ts).
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/' }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      # Repository secrets. Unknown paths serve index.html (not_found_handling in wrangler.jsonc).
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
